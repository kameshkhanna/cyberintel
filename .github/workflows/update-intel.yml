name: Update public intelligence snapshots
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intelligence-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve CISA KEV
        run: python scripts/fetch_intel.py
      - name: Retrieve Shodan aggregates
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: python scripts/fetch_shodan.py
      - name: Retrieve global cyber news
        run: python scripts/fetch_world.py
      - name: Commit intelligence snapshots
        run: |
          if [[ -n "$(git status --porcelain src/data/)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/intel.json src/data/shodan.json src/data/shodan-history.json src/data/world.json
            git commit -m 'chore: refresh intelligence snapshots'
            git pull --rebase origin main
            git push
          fi
