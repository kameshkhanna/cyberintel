name: Update public intelligence snapshots

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-refresh
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      kev: ${{ steps.kev.outcome }}
      cve: ${{ steps.cve.outcome }}
      shodan: ${{ steps.shodan.outcome }}
      news: ${{ steps.news.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve CISA KEV
        id: kev
        continue-on-error: true
        run: python scripts/fetch_intel.py
      - name: Enrich NVD and EPSS
        id: cve
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CVE_ENRICH_LIMIT: '20'
        run: |
          if [[ -f scripts/fetch_vulns.py ]]; then python scripts/fetch_vulns.py; else echo 'Vulnerability collector not installed'; exit 1; fi
      - name: Retrieve Shodan aggregates
        id: shodan
        continue-on-error: true
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          SHODAN_QUERY: ${{ vars.SHODAN_QUERY }}
        run: python scripts/fetch_shodan.py
      - name: Retrieve global cyber news
        id: news
        continue-on-error: true
        run: python scripts/fetch_world.py
      - name: Validate source data and build health snapshot
        env:
          COLLECTOR_KEV: ${{ steps.kev.outcome }}
          COLLECTOR_CVE: ${{ steps.cve.outcome }}
          COLLECTOR_SHODAN: ${{ steps.shodan.outcome }}
          COLLECTOR_NEWS: ${{ steps.news.outcome }}
        run: python scripts/validate_publish.py
      - name: Upload allowlisted intelligence snapshots
        uses: actions/upload-artifact@v4
        with:
          name: validated-intelligence-snapshots
          retention-days: 1
          if-no-files-found: error
          path: |
            src/data/intel.json
            src/data/vulnerabilities.json
            src/data/shodan.json
            src/data/shodan-history.json
            src/data/world.json
            src/data/source-health.json

  publish:
    needs: collect
    if: github.ref == 'refs/heads/main' && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download allowlisted intelligence snapshots
        uses: actions/download-artifact@v4
        with:
          name: validated-intelligence-snapshots
          path: src/data
      - name: Revalidate downloaded snapshots
        env:
          COLLECTOR_KEV: ${{ needs.collect.outputs.kev }}
          COLLECTOR_CVE: ${{ needs.collect.outputs.cve }}
          COLLECTOR_SHODAN: ${{ needs.collect.outputs.shodan }}
          COLLECTOR_NEWS: ${{ needs.collect.outputs.news }}
        run: python scripts/validate_publish.py
      - name: Commit validated snapshots
        run: |
          git add -- src/data/intel.json src/data/vulnerabilities.json src/data/shodan.json src/data/shodan-history.json src/data/world.json src/data/source-health.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: publish validated intelligence snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  notify:
    needs: [collect, publish]
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mark partial collector failures for GitHub notification
        env:
          KEV: ${{ needs.collect.outputs.kev }}
          CVE: ${{ needs.collect.outputs.cve }}
          SHODAN: ${{ needs.collect.outputs.shodan }}
          NEWS: ${{ needs.collect.outputs.news }}
        run: |
          for value in "$KEV" "$CVE" "$SHODAN" "$NEWS"; do
            if [[ "$value" == failure ]]; then
              echo 'One or more sources failed. Published snapshot may be degraded; review workflow logs.' >&2
              exit 1
            fi
          done
